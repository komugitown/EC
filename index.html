<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>YO MACHO Official</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">

<style>

:root{
  --accent:#4fd1c5;
}

body{
  margin:0;
  font-family:'M PLUS Rounded 1c',
    "Hiragino Maru Gothic ProN",
    "ヒラギノ丸ゴ ProN",
    sans-serif;
  background:linear-gradient(to bottom,#111 0%,#1a1a1a 40%,#222 70%,#2a2a2a 100%);
  color:white;
  padding:20px;
}

.container{
  max-width:1000px;
  margin:auto;
}

/* ===== ヘッダー ===== */

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:40px;
  flex-wrap:wrap;
}

.header-left{
  display:flex;
  align-items:center;
  gap:20px;
}

.header-right img{
  height:100px;
  opacity:0.9;
}

header img{
  height:120px;
  max-width:90vw;
}

h1{
  margin:0;
  font-size:28px;
}

/* ===== カード ===== */

.card{
  background:#2a2a2a;
  padding:20px;
  border-radius:20px;
  margin-bottom:30px;
}

/* ===== キャラクター ===== */

.characters{
  display:flex;
  flex-direction:column;
  gap:20px;
  margin-bottom:40px;
}

.character{
  display:flex;
  gap:20px;
  align-items:center;
  background:#2a2a2a;
  padding:15px;
  border-radius:20px;
  transition:0.2s;
}

.character:hover{
  transform:translateY(-5px);
}

.character img{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:15px;
  background:#111;
  flex-shrink:0;
}

.character-info{
  flex:1;
}

/* ===== 商品 ===== */

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.product{
  background:#2a2a2a;
  border-radius:20px;
  overflow:hidden;
  position:relative;
  transition:0.2s;
}

.product:hover{
  transform:translateY(-5px);
}

.product img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  background:#111;
}

.product-info{
  padding:15px;
}

.product-info button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:12px;
  background:var(--accent);
  color:#000;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

.product-info button:hover:not(:disabled){
  opacity:0.8;
  transform:scale(1.03);
}

.product-info button:disabled{
  background:#666;
  color:#ccc;
  cursor:not-allowed;
}

/* ===== SOLD OUT ===== */

.soldout-label{
  position:absolute;
  top:10px;
  left:10px;
  background:#ff6b6b;
  padding:5px 10px;
  font-size:11px;
  font-weight:bold;
  border-radius:8px;
  transform:rotate(-10deg);
}

.product.soldout img{
  opacity:0.5;
}

/* ===== スマホ ===== */

@media(max-width:600px){

  header{
    flex-direction:column;
    text-align:center;
  }

  .header-left{
    flex-direction:column;
  }

  .header-right img{
    height:80px;
  }

  header img{
    height:100px;
  }

  .character{
    gap:15px;
  }

  .character img{
    width:70px;
    height:70px;
  }

}

</style>
</head>

<body>

<div class="container">

<header>

  <div class="header-left">
    <img src="title.png" alt="YO MACHO Logo">
    <div>
      <h1>Welcome,<br>official YO MACHO!!</h1>
      <div>筋肉が膨らむブランドへようこそ</div>
    </div>
  </div>

  <!-- 追加ここ -->
  <div class="header-right">
    <img src="title_2.png" alt="">
  </div>

</header>

<div class="card">
<h2>Concept</h2>
<p>
YO MACHOは努力に反応するブランド。<br>
キャラクターはパンプアップし、ロゴは鼓動する。<br>
今日の1REPを、誇りに変える。
</p>
</div>

<h2>Characters</h2>
<div class="characters"></div>

<h2>Products</h2>
<div class="products"></div>

</div>

<script>

/* キャラ・商品そのまま（省略せず全部残してる） */

const characters=[

{name:"IRON PIT",image:"character_1.png",description:"鋼の精神を持つピットブル。不屈のパワーの象徴。"},
{name:"MUSCLE BIRD",image:"character_2.png",description:"胸筋が膨らむ伝説のハト。努力に反応してパンプアップ。"},
{name:"RUNNING CHEETAH",image:"character_3.png",description:"瞬発力の化身。スピードの極限体。"},
{name:"BULK BEAR",image:"character_4.png",description:"増量期の王者。プロテインを愛する森の支配者。"},
{name:"BULK BEAR",image:"character_4.png",description:"増量期の王者。プロテインを愛する森の支配者。"},
{name:"BULK BEAR",image:"character_4.png",description:"増量期の王者。プロテインを愛する森の支配者。"},
{name:"BULK BEAR",image:"character_4.png",description:"増量期の王者。プロテインを愛する森の支配者。"},
{name:"BULK BEAR",image:"character_4.png",description:"増量期の王者。プロテインを愛する森の支配者。"},
{name:"BULK BEAR",image:"character_4.png",description:"増量期の王者。プロテインを愛する森の支配者。"},
{name:"BULK BEAR",image:"character_4.png",description:"増量期の王者。プロテインを愛する森の支配者。"}
];

const charContainer=document.querySelector(".characters");

characters.forEach(char=>{
const item=document.createElement("div");
item.className="character";

item.innerHTML=`
<img src="${char.image}">
<div class="character-info">
<b>${char.name}</b><br>
<span style="opacity:0.7;font-size:14px;">
${char.description}
</span>
</div>
`;

charContainer.appendChild(item);
});

const products=[

{name:"YO MACHO Pigeon Tee",price:5200,image:"image_1.png",link:"#",soldout:false},
{name:"YO MACHO Iron Hoodie",price:8200,image:"image_2.png",link:"#",soldout:true},
{name:"YO MACHO Street Tank",price:4600,image:"image_3.png",link:"#",soldout:true},
{name:"YO MACHO Power Cap",price:3500,image:"image_4.png",link:"#",soldout:true},
{name:"YO MACHO Gym Shorts",price:5900,image:"image_5.png",link:"#",soldout:true},
{name:"YO MACHO Lift Socks",price:1800,image:"image_6.png",link:"#",soldout:true},
{name:"YO MACHO Pump Bottle",price:2400,image:"image_7.png",link:"#",soldout:true},
{name:"YO MACHO Beast Bag",price:9800,image:"image_8.png",link:"#",soldout:true},
{name:"YO MACHO Bulk Jacket",price:12800,image:"image_9.png",link:"#",soldout:true},
{name:"YO MACHO Limited Black Tee",price:6800,image:"image_10.png",link:"#",soldout:true}

];

const productContainer=document.querySelector(".products");

products.forEach(product=>{
const item=document.createElement("div");
item.className=product.soldout?"product soldout":"product";

item.innerHTML=`
${product.soldout?`<div class="soldout-label">SOLD OUT</div>`:""}
<img src="${product.image}">
<div class="product-info">
<b>${product.name}</b><br>
¥${product.price.toLocaleString()}
${product.soldout?`<button disabled>SOLD OUT</button>`:`<a href="${product.link}" target="_blank"><button>Buy on Amazon</button></a>`}
</div>
`;

productContainer.appendChild(item);
});

</script>

</body>
</html>
